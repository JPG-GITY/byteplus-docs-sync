# ---------------------------------------------------------------------------
# byteplus-docs-sync configuration
# ---------------------------------------------------------------------------

# BytePlus doc "products" to track. The slug is the path segment that comes
# right after /en/docs/  ->  https://docs.byteplus.com/en/docs/ModelArk
# Discover the full list with:  python crawler/crawl.py --discover
# NOTE: only products whose landing page exposes their /en/docs/{slug}/{id} nav
# tree enumerate correctly today. ~92 other slugs return 0 pages (their SPA nav
# loads differently) — pending a crawler enumeration upgrade before adding them.
# Full-catalog mode: auto-discover every product from the docs index each run
# (also picks up products BytePlus adds later). The explicit list below is kept
# as documentation/fallback but is ignored while crawl_all_products is true.
crawl_all_products: true

# Fallback guard: if the docs index yields fewer than this many products, the
# crawler falls back to the pinned `products:` list instead of crawling nothing.
# (In July 2026 the docs index moved its links from /en/docs/ to /docs/ and
# discovery silently returned zero, which wiped the index.)
min_expected_products: 10

# Refuse to overwrite sources.json if it would drop below this fraction of the
# committed index (override with ALLOW_SOURCES_SHRINK=1 for intentional cuts).
sources_shrink_floor_ratio: 0.5

# Deep vs index-only. Products here get full page-content snapshots (git-diff
# tracked, feed reference rewrites). ALL other discovered products are INDEX-ONLY:
# their page URLs+titles go into sources.json for live-fetch, no bodies downloaded.
# (BytePlus docs = ~18,800 pages total — snapshotting all bodies is impractical.)
full_snapshot_products:
  - ModelArk

# Slugs to skip in full-catalog mode: internal test pages + non-product utility
# areas (account/billing/legal/support consoles), not real product docs.
discover_ignore_slugs:
  - gavi-sept-test1
  - kickart
  - legal
  - support
  - message_center
  - Account
  - Billing-and-Cost
  - IAM
  - CloudIdentity
  - identity
  - organization
  - resourcemanagement

